<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f0">
  <meta name="description" content="Practise four beginner core exercises with animations, videos and guided sets.">
  <title>Core Routine</title>
  <link rel="icon" type="image/png" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./app.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="container masthead-inner">
      <button type="button" class="brand" id="brand" aria-label="Core Routine exercise guide">
        <img src="./icon-192.png" alt="" width="34" height="34">
        <span>Core Routine</span>
      </button>
    </div>
  </header>

  <main class="container main">
    <div class="intro">
      <div>
        <h1 id="page-title">Beginner core session</h1>
        <p id="page-description">Have a small pillow or rolled towel handy for the bridges.</p>
      </div>
      <div class="intro-actions">
        <button class="button button-text" type="button" id="start-over" hidden>Start over</button>
        <button class="button button-primary" type="button" id="mode-action"><span id="mode-label">Start session</span><span class="arrow" aria-hidden="true">→</span></button>
      </div>
    </div>

    <div class="layout">
      <section class="lesson surface" id="lesson" aria-labelledby="exercise-title">
        <div class="lesson-heading">
          <div>
            <h2 id="exercise-title" tabindex="-1">Glute bridges</h2>
            <p class="dose" id="dose">2 sets of 10 · 3-second hold</p>
          </div>
          <div class="segmented" id="media-switcher" role="group" aria-label="Demonstration format">
            <button type="button" data-media="animation" aria-pressed="true">Animation</button>
            <button type="button" data-media="video" aria-pressed="false">Video</button>
          </div>
        </div>

        <div id="animation-panel">
          <div class="stage">
            <canvas id="movement" role="img" aria-labelledby="exercise-title" aria-describedby="setup movement-cue"></canvas>
            <span class="phase" id="phase">Start position</span>
          </div>
          <div class="player-controls">
            <button type="button" class="button button-dark" id="run-action">
              <span class="play-icon" aria-hidden="true"></span><span id="run-label">Play animation</span>
            </button>
            <div class="set-tracker" id="set-tracker" hidden>
              <span id="rep-label"></span>
              <progress id="set-progress" value="0" max="1" aria-label="Set progress"></progress>
            </div>
            <label class="tap-setting" id="tap-setting" hidden>
              Taps per leg
              <select id="tap-count">
                <option value="8">8</option>
                <option value="9">9</option>
                <option value="10">10</option>
              </select>
            </label>
          </div>
          <p class="transition" id="transition" role="status" hidden></p>
        </div>

        <div id="video-panel" hidden>
          <div class="video-player" id="video-player"></div>
          <div class="video-credit">
            <span id="video-provider"></span>
            <a id="video-source" target="_blank" rel="noopener noreferrer">Open source video <span aria-hidden="true">↗</span></a>
          </div>
        </div>

        <div class="instructions">
          <h3>How to do it</h3>
          <p id="setup"></p>
          <p id="movement-cue"></p>
        </div>
      </section>

      <section class="complete surface" id="complete" aria-labelledby="complete-title" hidden>
        <span class="complete-mark" aria-hidden="true">✓</span>
        <h2 id="complete-title" tabindex="-1">Session complete</h2>
        <p>You finished all four exercises.</p>
        <button class="button button-primary" type="button" id="start-again">Start another session</button>
      </section>

      <aside class="programme surface" aria-labelledby="plan-title">
        <div class="plan-heading">
          <h2 id="plan-title">Session plan</h2>
          <span id="plan-progress" hidden></span>
        </div>
        <ol class="exercise-list">
          <li><button class="exercise-option" type="button" data-exercise="0" aria-current="step">
            <span class="exercise-number" aria-hidden="true">1</span>
            <span class="exercise-info"><span class="exercise-name">Glute bridges</span><span class="exercise-dose">2 sets of 10</span></span>
            <span class="exercise-chevron" aria-hidden="true">›</span>
          </button></li>
          <li><button class="exercise-option" type="button" data-exercise="1">
            <span class="exercise-number" aria-hidden="true">2</span>
            <span class="exercise-info"><span class="exercise-name">Clamshells</span><span class="exercise-dose">2 sets of 10 per side</span></span>
            <span class="exercise-chevron" aria-hidden="true">›</span>
          </button></li>
          <li><button class="exercise-option" type="button" data-exercise="2">
            <span class="exercise-number" aria-hidden="true">3</span>
            <span class="exercise-info"><span class="exercise-name">Dead bug heel taps</span><span class="exercise-dose">8–10 taps per leg</span></span>
            <span class="exercise-chevron" aria-hidden="true">›</span>
          </button></li>
          <li><button class="exercise-option" type="button" data-exercise="3">
            <span class="exercise-number" aria-hidden="true">4</span>
            <span class="exercise-info"><span class="exercise-name">Bird-dog leg slides</span><span class="exercise-dose">8 reps per side</span></span>
            <span class="exercise-chevron" aria-hidden="true">›</span>
          </button></li>
        </ol>
      </aside>
    </div>
    <noscript><p>Enable JavaScript to play animations and follow the session.</p></noscript>
  </main>
</body>
</html>
